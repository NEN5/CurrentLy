<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History | CurrentLy</title>
    <link rel="icon" type="image/png" href="logo_favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/history.css" />
  </head>
  <body>
    <header class="nav">
      <div class="nav-left">
        <a class="hx-back" href="index.html">&larr; Dashboard</a>
        <strong class="brand">History</strong>
      </div>
    </header>

    <main class="hx-wrap">
      <nav class="hx-tabs" role="tablist" aria-label="History type">
        <button id="tabOutages" role="tab" aria-selected="true" data-tab="outages">
          Power events
        </button>
        <button id="tabTheft" role="tab" aria-selected="false" data-tab="theft">
          Theft log
        </button>
      </nav>

      <p id="hxMsg" class="error" role="alert"></p>

      <section id="paneOutages" role="tabpanel" aria-labelledby="tabOutages">
        <p id="outageSummary" class="hx-summary"></p>
        <div class="hx-bar">
          <label class="hx-filter"
            >Show
            <select id="kind">
              <option value="all">all events</option>
              <option value="outage">power outages</option>
              <option value="brownout">brown outs</option>
            </select>
          </label>
          <span class="hx-updated" data-for="outages" aria-live="off"></span>
        </div>
        <div id="outageList" class="hx-log"></div>
        <p class="hx-note">
          Last 14 days. An outage is logged once the meter reports again after
          a gap of 5 minutes or more. Bill figures use your current rate.
        </p>
      </section>

      <section id="paneTheft" role="tabpanel" aria-labelledby="tabTheft" hidden>
        <p id="theftSummary" class="hx-summary"></p>
        <div class="hx-bar">
          <span></span>
          <span class="hx-updated" data-for="theft" aria-live="off"></span>
        </div>
        <div id="theftList" class="hx-log"></div>
        <p class="hx-note">
          Logged when the LINE meter reads noticeably more than the HOME meter
          for about 10 seconds.
        </p>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/history.js"></script>
  </body>
</html>
